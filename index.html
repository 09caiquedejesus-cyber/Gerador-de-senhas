<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Gerador de senhas</title>
</head>
<body>
    <main id="container-corpo">

        <section class="caixa-1" aria-label="Ferramenta de geracao">
            <div class="apresentacao">
                <h2>Melhor segurança</h2>

                <h1>Gerador de senhas aleatórias</h1>

                <p>Crie senhas fortes com letras, números e símbolos em poucos segundos.</p>
            </div>
        </section>

        <section class="caixa-2">   
            <div class="painel-senha">
                <label for="senha">Senha gerada</label>
                <div class="senha-gerada">
                    <div class="sg">
                        <input type="text" name="senha" id="senha" readonly placeholder="Clique em Gerar" autocomplete="off" spellcheck="false" aria-label="Senha gerada">
                        <button type="button" id="botao" class="btn" title="Copiar senha">
                            Copiar
                        </button>
                    </div>
              </div>
            </div>
            <p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>

            <div id="forca">
                <div class="forca-cabecalho">
                    <span>Força</span>
                    <strong id="medidor">Forte</strong>
                </div>

                <div class="med-vazio" aria-hidden="true">
                    <span id="vazio"></span>
                </div>
            </div>


            <form action="#" method="post" id="form">
                <div class="range-form">
                    <div class="tam">
                        <label for="length">Tamanho</label>
                        <output id="comprimento" for="length">16</output>
                    </div>
                    <input type="range" name="length" id="length" value="16" min="6" max="32">
                </div>


                <fieldset class="opcoes">
                    <legend>Caracteres</legend>

                    <label class="opcao" >
                        <input type="checkbox"  id="maiusculas" checked>
                        <span>Letras maiúsculas</span>
                    </label>

                    <label class="opcao" >
                        <input type="checkbox"  id="minusculas" checked>
                        <span>Letras minúsculas</span>
                    </label>

                    <label class="opcao" >
                        <input type="checkbox"  id="numeros" checked>
                        <span>Números</span>
                    </label>

                    <label class="opcao" >
                        <input type="checkbox"  id="simbolos" checked>
                        <span>Símbolos</span>
                    </label>
                </fieldset>

                <button type="submit" class="gerar">Gerar nova senha</button>
            </form>
        </section>

    </main>



    <script src="javascript.js"></script>
</body>
</html>
